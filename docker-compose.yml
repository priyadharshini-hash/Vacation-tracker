services:
  postgres:
    image: postgres:16-alpine
    container_name: vacation-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vacation_admin
      POSTGRES_PASSWORD: vacation_pw
      POSTGRES_DB: vacation_tracker
    ports:
      - "5432:5432"
    volumes:
      - vacation_tracker_data:/var/lib/postgresql/data

volumes:
  vacation_tracker_data:
